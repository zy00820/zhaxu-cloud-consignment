# ===== 栈序云寄售 Render 一键部署配置 =====
# 使用方法：https://render.com → New → Blueprint → 选择本仓库即可
# 环境变量请在 Render 控制台填写（不要写在代码里）

services:
  - type: web
    name: zhaxu-cloud-consignment
    runtime: node
    plan: free  # 免费版（15分钟无请求会休眠，正式使用可改为 starter）
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # ===== 基础配置 =====
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://zy00820.github.io/zhaxu-cloud-consignment
      # 是否允许模拟支付（未配置真实支付时降级为模拟，生产环境可设为 false）
      - key: ALLOW_MOCK
        value: true

      # ===== 支付宝支付 =====
      # 申请地址：https://open.alipay.com
      - key: ALIPAY_APP_ID
        sync: false  # 设为 false 表示需在 Render 控制台手动填写（敏感信息）
      - key: ALIPAY_PRIVATE_KEY
        sync: false
      - key: ALIPAY_PUBLIC_KEY
        sync: false
      # 正式：https://openapi.alipay.com/gateway.do
      # 沙箱：https://openapi-sandbox.dl.alipaydev.com/gateway.do
      - key: ALIPAY_GATEWAY
        value: https://openapi-sandbox.dl.alipaydev.com/gateway.do
      # 部署后替换为你的 Render 域名，例如 https://zhaxu-cloud-consignment.onrender.com/api/pay/alipay/notify
      - key: ALIPAY_NOTIFY_URL
        sync: false
      - key: ALIPAY_RETURN_URL
        sync: false

      # ===== 微信支付 =====
      # 申请地址：https://pay.weixin.qq.com
      - key: WX_APPID
        sync: false
      - key: WX_MCHID
        sync: false
      - key: WX_APIKEY
        sync: false
      - key: WX_NOTIFY_URL
        sync: false
